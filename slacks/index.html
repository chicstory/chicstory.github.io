<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아도라블 1초 품번 판독기 (AdoraPick)</title>
  <meta name="description" content="아도라블 슬랙스 주문서 품목명 1초 품번 역매핑 & 창고 피킹 속견표">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --target-gold: #f59e0b;
      --target-bg: rgba(245, 158, 11, 0.12);
      --target-border: #f59e0b;
      --warning-bg: rgba(239, 68, 68, 0.12);
      --warning-border: #ef4444;
      --warning-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 10px 12px 80px 12px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* 상단 헤더 & 검색바 */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 0 10px 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
    }

    .stats-count {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* 검색창 */
    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 52px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 14px;
      padding: 0 46px 0 16px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #67e8f9;
      box-shadow: 0 4px 24px rgba(103, 232, 249, 0.35);
    }

    .search-input::placeholder {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #475569;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-btn.visible {
      display: flex;
    }

    /* 칩 필터 */
    .chips-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 2px 0;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex-shrink: 0;
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #1e293b;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      font-weight: 800;
    }

    /* 🎯 스마트 옵션 디코더 박스 (초고대비 하이라이트) */
    .decoder-hero {
      margin-top: 12px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(16, 185, 129, 0.12));
      border: 2px solid var(--target-gold);
      border-radius: 16px;
      padding: 14px 16px;
      position: relative;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
      animation: pulseGlow 1.8s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 2px 14px rgba(245, 158, 11, 0.2); }
      to { box-shadow: 0 4px 24px rgba(245, 158, 11, 0.4); }
    }

    .decoder-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--target-gold);
      color: #0b1120;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .decoder-target-code {
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 0.5px;
      font-family: "Courier New", Courier, monospace, sans-serif;
      line-height: 1.1;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .decoder-subsize {
      font-size: 1.25rem;
      color: #34d399;
      font-weight: 800;
    }

    .decoder-desc {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .decoder-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .decoder-meta span strong {
      color: #38bdf8;
    }

    .decoder-copy-hint {
      margin-top: 8px;
      font-size: 0.74rem;
      color: #94a3b8;
      text-align: right;
    }

    /* 카드 리스트 */
    .results-container {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      transition: transform 0.1s, border-color 0.15s;
      position: relative;
    }

    .item-card:active {
      transform: scale(0.99);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .code-badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .code-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.5px;
      font-family: "Courier New", Courier, monospace, sans-serif;
      cursor: pointer;
    }

    .tag-gender {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tag-gender.female {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
      border: 1px solid #db2777;
    }
    .tag-gender.male {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #2563eb;
    }

    .tag-length {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tag-length.long {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #059669;
    }
    .tag-length.short {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #d97706;
    }

    .tag-season {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
      border: 1px solid #0891b2;
    }
    .tag-season.summer {
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
      border: 1px solid #ca8a04;
    }

    .item-name-kr {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .alias-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .alias-text strong {
      color: #cbd5e1;
    }

    .meta-box {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meta-label {
      color: #64748b;
      font-weight: 600;
      min-width: 58px;
    }
    .meta-val {
      color: #e2e8f0;
      font-weight: 600;
    }
    .meta-val.loc {
      color: #38bdf8;
      font-weight: 700;
    }

    /* 컬러 스와치 & 품번 코드 목록 */
    .colors-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .color-chip {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .color-chip:active {
      transform: scale(0.95);
      background: #38bdf8;
      color: #0b1120;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dot-black { background: #000000; }
    .dot-charcoal { background: #3f3f46; }
    .dot-navy { background: #1e3a8a; }
    .dot-ivory { background: #fef08a; }
    .dot-beige { background: #d4d4d8; }
    .dot-brown { background: #78350f; }
    .dot-pink { background: #f472b6; }

    /* 사이즈 터치 버튼 */
    .sizes-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 6px;
      border-top: 1px dashed #334155;
    }
    .size-guide-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-right: 4px;
    }
    .size-btn {
      padding: 4px 8px;
      border-radius: 6px;
      background: #0b1120;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .size-btn:active {
      background: #10b981;
      color: #fff;
      border-color: #10b981;
    }

    /* 함정/주의사항 */
    .card-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--warning-text);
      font-weight: 600;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }
    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
    }
  </style>
</head>

    const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    function getChosung(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code >= 0 && code <= 11171) {
          result += CHOSUNG[Math.floor(code / 588)];
        } else {
          result += str.charAt(i);
        }
      }
      return result;
    }

          location: isWinter ? '남측 우측 코어존 (2층)' : '중앙 2번 더블렉 (앞뒤 맞댐 9단)',
          bag: '3호',
          hint: `입력문장 분석: [${isWinter ? '기모' : '사계절'}] + [${finalLen === 'S' ? '숏' : '롱'}] + [${colorName || '블랙'}] ➔ ${finalCode}`
        };
      }

      // 3) 여성 투핀턱 와이드 (A라인 또는 WA라인)
      if (text.includes('투핀턱') || text.includes('와이드') && (text.includes('여성') || text.includes('여자') || text.includes('wa') || text.includes('a-s') || text.includes('a-l'))) {
        const isWinter = text.includes('기모') || text.includes('겨울');
        const prefix = isWinter ? 'WA' : 'A';
        const finalLen = length || 'L';
        const finalCol = colorNum || '1';
        const finalCode = `${prefix}-${finalLen}${finalCol}`;
        return {
          code: finalCode,
          size: size || 'M (28호칭)',
          name: `여성 ${isWinter ? '기모' : '사계절'} 투핀턱 와이드 ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: isWinter ? '남측 우측 코어존' : '중앙 1번 더블렉',
          bag: '3호',
          hint: `여성 28호칭은 영문 M입니다!`
        };
      }

      // 3) 여성 스트레이트 (B라인)
      if (text.includes('스트레이트') || text.includes('일자') || text.includes('b-l') || text.includes('b-s') || text.includes('ajl002l')) {
        const finalLen = length || 'L';
        const finalCol = colorNum || '1';
        const finalCode = `B-${finalLen}${finalCol}`;
        return {
          code: finalCode,
          size: size || 'M',
          name: `여성 사계절 스트레이트 일자 ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: '중앙 2번 더블렉',
          bag: '3호',
          hint: '레디핏 코드는 AJL002L = B-L1'
        };
      }

      // 4) 특가슬랙스 (7712 롱 / 8812 숏)
      if (text.includes('7712') || text.includes('8812') || text.includes('특가슬랙스') || (text.includes('특가') && !text.includes('밴딩') && !text.includes('뒷밴'))) {
        const finalLen = length || (text.includes('8812') || text.includes('숏') || text.includes('9부') ? 'S' : 'L');
        const baseCode = finalLen === 'S' ? '8812' : '7712';
        const finalCol = colorNum || '1';
        const finalCode = `${baseCode}-${finalCol}`;
        return {
          code: finalCode,
          size: size || 'XL(34)',
          name: `남성 특가 슬랙스 ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: '📍 북측 벽면 1열 렉 집중존 (통로 북쪽)',
          bag: '3호',
          hint: `트렌드쉽 표기: ${finalLen}${baseCode}-${finalCol}`
        };
      }

      // 5) 오비 슬랙스 (2911 와이드오비 vs 5811 여름 풀오비)
      if (text.includes('오비') || text.includes('풀오비')) {
        const isSummer = text.includes('여름') || text.includes('쿨') || text.includes('5811');
        if (isSummer) {
          return {
            code: '5811',
            size: size || '32(L)',
            name: `남성 여름 쿨슬랙스 풀오비(벨트고리형) ${colorName || '블랙'}`,
            location: '5층 쿨 창고 (더미베이터 연결)',
            bag: '3호',
            hint: '여름 쿨 원단 벨트오비 타입 (11블랙, 13네이비, 14아이, 19연베)'
          };
        } else {
          const colSuffix = colorNum === '2' ? '2944' : (colorNum === '4' ? '2977' : (colorNum === '9' ? '2999' : '2911'));
          return {
            code: colSuffix,
            size: size || 'XL(34)',
            name: `남성 특가와이드 오비(벨트고리형) 슬랙스 ${colorName || '블랙'}`,
            location: '1911 상/하단 세로 선반 전용 구역',
            bag: '3호',
            hint: `사계절 벨트오비형: 2911(블랙), 2944(차콜), 2977(아이), 2999(연베)`
          };
        }
      }

      // 6) 특가밴딩 (181 숏 vs 191 롱)
      if (text.includes('181') || text.includes('191') || text.includes('특가밴딩')) {
        const isShort = text.includes('181') || text.includes('숏') || text.includes('9부') || !text.includes('191');
        const finalCode = isShort ? (colorNum === '2' ? '184' : (colorNum === '3' ? '183' : '181')) : (colorNum === '2' ? '194' : (colorNum === '3' ? '193' : '191'));
        return {
          code: finalCode,
          size: size || 'L(32)',
          name: `남성 특가밴딩 슬랙스 ${isShort ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: isShort ? '🚀 181은 작업대 바로 옆 발송대 3걸음 단독배치!' : '남측 우측 코어존 (2층)',
          bag: '3호',
          hint: isShort ? '181은 숏(9부)! 191(롱)과 헷갈리지 마세요.' : '191은 롱(10부)!'
        };
      }

      // 7) 흑청 (4196)
      if (text.includes('4196') || text.includes('흑청')) {
        return {
          code: '4196-흑청',
          size: size || '2XL(36)',
          name: '남성 흑청 슬랙스 / 데님팬츠 (후앙스 등)',
          location: '5층 창고 또는 2층 특별 보관대',
          bag: '3호',
          hint: '후앙스 4196흑청-2XL(36) 출고'
        };
      }

      return null;
    }

    // =============================================================
    // 상태 및 엘리먼트 바인딩
    // =============================================================
    let currentFilter = 'all';
    let searchQuery = '';

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const cardsContainer = document.getElementById('cardsContainer');
    const decoderContainer = document.getElementById('decoderContainer');
    const itemCount = document.getElementById('itemCount');
    const chipsBar = document.getElementById('chipsBar');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    function copyText(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`📋 ${label || text} 복사됨`);
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`📋 ${label || text} 복사됨`);
    }

    // =============================================================
    // 필터링 & 검색 엔진
    // =============================================================
    function filterItems() {
      const qRaw = searchQuery.trim().toLowerCase();
      const query = qRaw.replace(/-/g, '').replace(/\s+/g, '');
      const queryChosung = getChosung(qRaw.replace(/\s+/g, ''));

      return ITEMS.filter(item => {
        // 1. 칩 필터
        if (currentFilter === 'winter' && item.season !== 'winter') return false;
        if (currentFilter === 'basic' && item.season !== 'basic') return false;
        if (currentFilter === 'summer' && item.season !== 'summer') return false;
        if (currentFilter === 'female' && item.gender !== 'female') return false;
        if (currentFilter === 'male' && item.gender !== 'male') return false;
        if (currentFilter === 'fast' && !item.isFast) return false;

        // 검색어가 없으면 통과
        if (!query) return true;

        // 검색 대상 합성 (슬랙스, 바지, 팬츠 키워드를 기본 탑재하여 다중 단어 검색 오류 방지)
        const colorCodes = item.colors.map(c => c.code + " " + c.name).join(' ');
        const fullTarget = (
          item.code + " " +
          item.name + " " +
          "슬랙스 바지 팬츠 " +
          item.aliases.join(' ') + " " +
          colorCodes + " " +
          item.location + " " +
          item.warning
        ).toLowerCase();

        const cleanTarget = fullTarget.replace(/-/g, '').replace(/\s+/g, '');
        const targetChosung = getChosung(cleanTarget);

        // 전체 포함 or 초성 포함
        if (cleanTarget.includes(query) || targetChosung.includes(queryChosung)) return true;

        // 다중 단어 분리 매칭 (공백으로 쪼갠 각 단어가 모두 포함되는지 확인)
        const words = qRaw.split(/\s+/);
        return words.every(w => {
          const wClean = w.replace(/-/g, '');
          const wCho = getChosung(wClean);
          return cleanTarget.includes(wClean) || targetChosung.includes(wCho);
        });
      });
    }

    // =============================================================
    // 렌더링 엔진 (디코더 + 카드)
    // =============================================================
    function renderApp() {
      // 1. 스마트 옵션 디코더 판독
      const decoded = parseOrderOption(searchQuery);
      if (decoded) {
        const fullCopy = `${decoded.code}-${decoded.size}`;
        decoderContainer.innerHTML = `
          <div class="decoder-hero" onclick="copyText('${fullCopy}', '최종 출고품번 ${fullCopy}')">
            <div class="decoder-badge">🎯 주문 옵션 최종 판독 결과 (터치 시 복사)</div>
            <div class="decoder-target-code">
              <span>${decoded.code}</span>
              <span class="decoder-subsize">[${decoded.size}]</span>
            </div>
            <div class="decoder-desc">${decoded.name}</div>
            <div class="decoder-meta">
              <span>📍 위치: <strong>${decoded.location}</strong></span>
              <span>📦 봉투: <strong>${decoded.bag}</strong></span>
              ${decoded.hint ? `<span style="color:#fbbf24;">💡 ${decoded.hint}</span>` : ''}
            </div>
            <div class="decoder-copy-hint">👉 터치하면 '${fullCopy}' 클립보드 즉시 복사</div>
          </div>
        `;
      } else {
        decoderContainer.innerHTML = '';
      }

      // 2. 카드 목록 렌더링
      const filtered = filterItems();
      itemCount.textContent = `결과 ${filtered.length}개`;

      if (filtered.length === 0 && !decoded) {
        cardsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">검색된 품목이 없습니다</div>
            <p style="font-size: 0.85rem;">오비, 세미부츠컷 검정 숏, 181, 7712, SAS 등을 입력해보세요.</p>
          </div>
        `;
        return;
      }

      cardsContainer.innerHTML = filtered.map(item => {
        const genderTag = item.gender === 'female' 
          ? '<span class="tag-gender female">여성</span>' 
          : '<span class="tag-gender male">남성</span>';

        let lengthTag = '';
        if (item.length === 'long') lengthTag = '<span class="tag-length long">롱 (10부)</span>';
        else if (item.length === 'short') lengthTag = '<span class="tag-length short">숏 (9부)</span>';
        else if (item.length === 'both') lengthTag = '<span class="tag-length long">롱/숏 혼합</span>';

        const seasonTag = item.season === 'winter'
          ? '<span class="tag-season">❄️ 기모/본딩</span>'
          : (item.season === 'summer' ? '<span class="tag-season summer">☀️ 쿨/라이크라</span>' : '<span class="tag-season" style="background:rgba(100,116,139,0.2);color:#94a3b8;border-color:#475569;">사계절</span>');

        const colorsHtml = item.colors.map(c => `
          <div class="color-chip" onclick="copyText('${c.code}', '${c.name} (${c.code})')">
            <span class="color-dot ${c.dot}"></span>
            <span>${c.name}</span>
            <span style="color:#38bdf8;font-size:0.7rem;font-weight:700;">[${c.code}]</span>
          </div>
        `).join('');

        const sizesHtml = item.sizes.map(s => {
          const pureSize = s.split('(')[0];
          return `<button class="size-btn" onclick="copySizeWithCode('${item.code}', '${pureSize}')">${s}</button>`;
        }).join('');

        return `
          <article class="item-card">
            <div class="card-top">
              <div class="code-badge-group">
                <span class="code-title" onclick="copyText('${item.code}', '품번 ${item.code}')">${item.code}</span>
                ${genderTag}
                ${lengthTag}
                ${seasonTag}
              </div>
            </div>

            <div class="item-name-kr">${item.name}</div>
            
            <div class="alias-text">
              <strong>주문서 표기명:</strong> ${item.aliases.join(', ')}
            </div>

            <div class="meta-box">
              <div class="meta-row">
                <span class="meta-label">📍 창고위치:</span>
                <span class="meta-val loc">${item.location}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">📦 권장봉투:</span>
                <span class="meta-val">${item.bag}</span>
              </div>
            </div>

            <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:4px;font-weight:600;">🎨 색상별 품번 (터치 시 복사):</div>
            <div class="colors-grid">
              ${colorsHtml}
            </div>

            <div class="sizes-wrap">
              <span class="size-guide-label">📏 사이즈:</span>
              ${sizesHtml}
            </div>

            ${item.warning ? `<div class="card-warning">${item.warning}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    function copySizeWithCode(itemCode, size) {
      const pureCode = itemCode.split(' ')[0].split('/')[0];
      const fullCode = `${pureCode}-${size}`;
      copyText(fullCode, `${fullCode}`);
    }

    // =============================================================
    // 이벤트 바인딩
    // =============================================================
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearBtn.classList.add('visible');
      } else {
        clearBtn.classList.remove('visible');
      }
      renderApp();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.remove('visible');
      searchInput.focus();
      renderApp();
    });

    chipsBar.addEventListener('click', (e) => {
      const target = e.target.closest('.chip-btn');
      if (!target) return;

      document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('active'));
      target.classList.add('active');

      currentFilter = target.dataset.filter;
      renderApp();
    });

    // 초기 실행
    renderApp();
  </script>
</body>
</html>
