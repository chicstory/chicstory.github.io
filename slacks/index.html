<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아도라블 1초 품번 판독기 & 2층 박스 적재 지도</title>
  <meta name="description" content="아도라블 슬랙스 주문서 품목명 1초 품번 역매핑 & 2층 창고 박스 적재 실측 지도">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --target-gold: #f59e0b;
      --target-bg: rgba(245, 158, 11, 0.12);
      --box-stack-bg: #1e293b;
      --box-stack-border: #475569;
      --box-highlight: #f59e0b;
      --warning-bg: rgba(239, 68, 68, 0.12);
      --warning-border: #ef4444;
      --warning-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 8px 10px 80px 10px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* 상단 헤더 & 모드 전환 탭 */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 0 8px 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
    }

    /* 탭 전환 버튼 */
    .main-tab-bar {
      display: flex;
      gap: 6px;
      background: #0f172a;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 8px;
    }

    .main-tab-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .main-tab-btn.active {
      background: var(--card-bg);
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* 검색창 */
    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 48px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 0 44px 0 14px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      outline: none;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.2);
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #67e8f9;
      box-shadow: 0 4px 22px rgba(103, 232, 249, 0.35);
    }

    .search-input::placeholder {
      color: #64748b;
      font-size: 0.88rem;
      font-weight: 400;
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: #475569;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-btn.visible {
      display: flex;
    }

    /* 칩 필터 */
    .chips-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 2px 0;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #1e293b;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      font-weight: 800;
    }

    /* 🎯 스마트 옵션 디코더 박스 */
    .decoder-hero {
      margin-top: 10px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(16, 185, 129, 0.12));
      border: 2px solid var(--target-gold);
      border-radius: 14px;
      padding: 12px 14px;
      position: relative;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
      animation: pulseGlow 1.8s infinite alternate;
      cursor: pointer;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 2px 14px rgba(245, 158, 11, 0.2); }
      to { box-shadow: 0 4px 24px rgba(245, 158, 11, 0.4); }
    }

    .decoder-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--target-gold);
      color: #0b1120;
      padding: 2px 7px;
      border-radius: 5px;
      margin-bottom: 6px;
    }

    .decoder-target-code {
      font-size: 1.85rem;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 0.5px;
      font-family: "Courier New", Courier, monospace, sans-serif;
      line-height: 1.1;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .decoder-subsize {
      font-size: 1.2rem;
      color: #34d399;
      font-weight: 800;
    }

    .decoder-desc {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .decoder-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.35);
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .decoder-meta span strong {
      color: #38bdf8;
    }

    /* 카드 리스트 */
    .results-container {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      transition: transform 0.1s, border-color 0.15s;
      position: relative;
    }

    .item-card:active {
      transform: scale(0.99);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .code-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .code-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.5px;
      font-family: "Courier New", Courier, monospace, sans-serif;
      cursor: pointer;
    }

    .tag-gender {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .tag-gender.female {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
      border: 1px solid #db2777;
    }
    .tag-gender.male {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #2563eb;
    }

    .tag-length {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .tag-length.long {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #059669;
    }
    .tag-length.short {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #d97706;
    }

    .item-name-kr {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .alias-text {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .meta-box {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.8rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meta-label {
      color: #64748b;
      font-weight: 600;
      min-width: 55px;
    }
    .meta-val {
      color: #e2e8f0;
      font-weight: 600;
    }
    .meta-val.loc {
      color: #38bdf8;
      font-weight: 700;
    }

    /* 컬러 스와치 & 사이즈 */
    .colors-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .color-chip {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .color-chip:active {
      background: #38bdf8;
      color: #0b1120;
    }

    .color-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dot-black { background: #000000; }
    .dot-charcoal { background: #3f3f46; }
    .dot-navy { background: #1e3a8a; }
    .dot-ivory { background: #fef08a; }
    .dot-beige { background: #d4d4d8; }
    .dot-brown { background: #78350f; }

    .sizes-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 6px;
      border-top: 1px dashed #334155;
    }
    .size-btn {
      padding: 3px 7px;
      border-radius: 5px;
      background: #0b1120;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .size-btn:active {
      background: #10b981;
      color: #fff;
    }

    .card-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--warning-text);
      font-weight: 600;
    }

    /* =============================================================
       🗺️ 2층 박스 적재 실측 지도 스타일 (Box-Grid Map)
       철제 선반 일절 없음! 바닥에서 위로 최대 9단 탑 쌓기 적재 구조
       ============================================================= */
    .map-view-wrapper {
      display: none;
      margin-top: 10px;
    }
    .map-view-wrapper.active {
      display: block;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .map-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    .l-9tier { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; }
    .l-6tier { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; }
    .l-fast { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; }

    .tier-badge.nine {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .tier-gauge-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 3px 6px;
      margin-top: 5px;
      font-size: 0.65rem;
    }
    .tier-gauge-dots {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .tier-gauge-dot {
      width: 3px;
      height: 7px;
      border-radius: 1px;
      background: #334155;
    }
    .tier-gauge-dot.f9 { background: #ef4444; }
    .tier-gauge-dot.f6 { background: #38bdf8; }
    .tier-gauge-dot.ffast { background: #f59e0b; }
    .tier-gauge-label {
      color: #94a3b8;
      font-size: 0.62rem;
      font-weight: 600;
    }

    .map-tool-btns {
      display: flex;
      gap: 6px;
    }
    .map-tool-btn {
      padding: 4px 8px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .map-tool-btn.primary {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

        /* =============================================================
       🗺️ 2층 박스 적재 실측 지도 스타일 (스케치 2 & 3 가로배치 + 콤팩트 모눈)
       ============================================================= */
    .warehouse-container {
      background: #070d18;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 상단: 3 (스케치 3 메인 단독 전체 폭) */
    .zone-top-main {
      width: 100%;
    }

    /* 하단: 2 (좌측: 휴게실/사무실) ── 1 (우측: 남측 코어 & 작업대 신상대) 가로 2열 배치 */
    .zones-bottom-split {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 12px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .zones-bottom-split {
        grid-template-columns: 1fr;
      }
    }

    .zone-block {
      border: 1px dashed #334155;
      border-radius: 10px;
      padding: 8px;
      background: rgba(15, 23, 42, 0.65);
    }

    .zone-block.main-zone {
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .zone-header {
      font-size: 0.8rem;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .zone-badge-main {
      font-size: 0.65rem;
      padding: 1px 7px;
      border-radius: 4px;
      background: #0284c7;
      color: #fff;
      font-weight: 800;
    }

    .zone-header-actions {
      display: flex;
      gap: 4px;
    }

    .zone-btn-sm {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }
    .zone-btn-sm:hover {
      background: #334155;
      color: #fff;
    }

    /* 행(Row) 컨트롤 */
    .row-wrap {
      margin-bottom: 6px;
    }

    .row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .row-label {
      font-size: 0.68rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      gap: 4px;
    }

    .row-action-btn {
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 3px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #64748b;
      cursor: pointer;
    }
    .row-action-btn:hover {
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* 🎯 콤팩트 모눈 박스 타일 & 세로 통행로 플렉스 컨테이너 */
    .box-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: stretch;
    }

    .box-stack-card {
      flex: 1 1 88px;
      min-width: 80px;
      max-width: 125px;
      background: var(--box-stack-bg);
      border: 1px solid var(--box-stack-border);
      border-radius: 6px;
      padding: 4px 5px;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s;
      position: relative;
    }

    /* 🚶 세로 통행로 타일 (박스들 사이를 가르는 수직 통로) */
    .vertical-aisle-card {
      flex: 0 0 32px;
      width: 32px;
      min-height: 54px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(30, 41, 59, 0.75),
        rgba(30, 41, 59, 0.75) 5px,
        rgba(15, 23, 42, 0.85) 5px,
        rgba(15, 23, 42, 0.85) 10px
      );
      border: 1px dashed #64748b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .vertical-aisle-card:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
    .v-aisle-icon {
      font-size: 0.72rem;
    }
    .v-aisle-text {
      font-size: 0.54rem;
      font-weight: 800;
      color: #94a3b8;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: -1px;
    }
    .v-aisle-del-btn {
      font-size: 0.52rem;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 3px;
      padding: 0 2px;
      cursor: pointer;
      margin-top: 1px;
    }
    .v-aisle-del-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .box-stack-card:hover {
      border-color: #38bdf8;
    }

    .box-stack-card:active {
      transform: scale(0.97);
    }

    .box-stack-card.highlight {
      border-color: #fbbf24 !important;
      background: rgba(245, 158, 11, 0.25) !important;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.7);
      animation: boxBlink 1s infinite alternate;
    }

    .box-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .box-code {
      font-size: 0.78rem;
      font-weight: 900;
      color: #38bdf8;
      font-family: "Courier New", Courier, monospace, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tier-badge {
      font-size: 0.58rem;
      font-weight: 800;
      padding: 0.5px 3px;
      border-radius: 3px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .tier-badge.six {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .tier-badge.fast {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #fbbf24;
    }
    .tier-badge.nine {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .box-name {
      font-size: 0.65rem;
      color: #ffffff;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 2px;
      overflow: hidden;
      display: -webkit-box;

    // =============================================================
    // 🎯 스마트 주문 옵션 디코더 (단품 판독)
    // =============================================================
    function parseOrderOption(raw) {
      if (!raw || raw.trim().length < 2) return null;
      const text = raw.trim().toLowerCase();

      let length = null;
      let colorNum = null;
      let colorName = '';
      let size = '';

      if (text.includes('숏') || text.includes('9부') || text.includes('_숏') || text.includes('-숏')) length = 'S';
      else if (text.includes('롱') || text.includes('10부') || text.includes('_롱') || text.includes('-롱')) length = 'L';

      if (text.includes('검정') || text.includes('블랙') || text.includes('black') || text.includes('-1')) {
        colorNum = '1'; colorName = '블랙';
      } else if (text.includes('차콜') || text.includes('먹색') || text.includes('먹') || text.includes('-2')) {
        colorNum = '2'; colorName = '차콜';
      } else if (text.includes('네이비') || text.includes('곤색') || text.includes('-3')) {
        colorNum = '3'; colorName = '네이비';
      } else if (text.includes('아이보리') || text.includes('크림') || text.includes('-4')) {
        colorNum = '4'; colorName = '아이/크림';
      } else if (text.includes('연그레이') || text.includes('-7')) {
        colorNum = '7'; colorName = '연그레이';
      }

      const sizeMatch = text.match(/(4xl|3xl|2xl|xl|s|m|l|40|38|36|34|32|30|28|26)/i);
      if (sizeMatch) size = sizeMatch[0].toUpperCase();

      // 0) 2WC 신상 부츠컷 판독 (작업대 우측 신상대)
      if (text.includes('2wc')) {
        const finalLen = length || (text.includes('2wc-s') || text.includes('숏') ? 'S' : 'L');
        const finalCol = colorNum || '1';
        const finalCode = `2WC-${finalLen}${finalCol}`;
        return {
          code: finalCode,
          size: size || 'S',
          name: `여성 [신상] 기모부츠컷 ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: '📍 [신상 전용] 작업대 바로 우측 신상 스택 (최대 6단)',
          bag: '3호',
          hint: '🚨 스케치1 지도: 통로 옆 2WC-S3 및 작업대 우측 신상 6단 스택!'
        };
      }

      // 1) 여름 쿨 SA-L/SA-S, SC-L/SC-S
      if (text.includes('sa-l') || text.includes('sa-s') || text.includes('sc-l') || text.includes('sc-s') || (text.includes('쿨') && (text.includes('와이드') || text.includes('부츠컷')))) {
        const isBoot = text.includes('sc') || text.includes('부츠컷');
        const finalPrefix = isBoot ? 'SC' : 'SA';
        const finalLen = length || (text.includes('-s') || text.includes('숏') ? 'S' : 'L');
        const finalCol = colorNum || '1';
        const finalCode = `${finalPrefix}-${finalLen}${finalCol}`;
        return {
          code: finalCode,
          size: size || 'M(28)',
          name: `여성 여름 쿨 ${isBoot ? '부츠컷' : '와이드'} ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: '5층 쿨 창고 (더미베이터 연결)',
          bag: '3호',
          hint: `여름 신규 공식 품번: ${finalCode}`
        };
      }

      // 2) 세미부츠컷 (C-S / C-L)
      if (text.includes('부츠컷') || text.includes('세미부츠컷') || text.includes('c-s') || text.includes('c-l')) {
        const isWinter = text.includes('기모') || text.includes('겨울');
        const prefix = isWinter ? 'WC' : 'C';
        const finalLen = length || 'S';
        const finalCol = colorNum || '1';
        const finalCode = `${prefix}-${finalLen}${finalCol}`;
        return {
          code: finalCode,
          size: size || 'L (권장호칭)',
          name: `여성 ${isWinter ? '겨울기모' : '사계절'} 세미부츠컷 ${finalLen === 'S' ? '9부(숏)' : '10부(롱)'} ${colorName || '블랙'}`,
          location: isWinter ? '휴게실 앞 중앙 스택 9단' : '중앙 1번 더블스택 하단(C-S1~4)',
          bag: '3호',
          hint: `입력문장 분석: [${finalLen === 'S' ? '숏' : '롱'}] + [${colorName || '블랙'}] ➔ ${finalCode}`
        };
      }

      // 3) 오비 슬랙스 (2911 vs 5811)
      if (text.includes('오비') || text.includes('풀오비')) {
        const isSummer = text.includes('여름') || text.includes('쿨');
        if (isSummer) {
          return {
            code: '5811',
            size: size || '32(L)',
            name: `남성 여름 쿨슬랙스 풀오비(벨트고리형) ${colorName || '블랙'}`,
            location: '5층 쿨 창고',
            bag: '3호',
            hint: '여름 쿨 벨트오비 타입'
          };
        } else {
          return {
            code: '2911',
            size: size || 'XL(34)',
            name: `남성 특가와이드 오비 슬랙스 ${colorName || '블랙'}`,
            location: '3번 통로 바닥 적재 3줄 (최대 9단)',
            bag: '3호',
            hint: '사계절 벨트오비 2911'
          };
        }
      }

      return null;
    }

    function copyText(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`📋 ${label || text} 복사됨`));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`📋 ${label || text} 복사됨`);
      }
    }

    // =============================================================
    // 판독기 렌더링
    // =============================================================
    function renderFinder() {
      const decoded = parseOrderOption(searchQuery);
      if (decoded) {
        const fullCopy = `${decoded.code}-${decoded.size}`;
        decoderContainer.innerHTML = `
          <div class="decoder-hero" onclick="copyText('${fullCopy}', '최종 출고품번 ${fullCopy}')">
            <div class="decoder-badge">🎯 주문 옵션 최종 판독 결과 (터치 시 복사)</div>
            <div class="decoder-target-code">
              <span>${decoded.code}</span>
              <span class="decoder-subsize">[${decoded.size}]</span>
            </div>
            <div class="decoder-desc">${decoded.name}</div>
            <div class="decoder-meta">
              <span>📍 위치: <strong>${decoded.location}</strong></span>
              <span>📦 봉투: <strong>${decoded.bag}</strong></span>
              ${decoded.hint ? `<span style="color:#fbbf24;">💡 ${decoded.hint}</span>` : ''}
            </div>
          </div>
        `;
      } else {
        decoderContainer.innerHTML = '';
      }

      const qRaw = searchQuery.trim().toLowerCase();
      const query = qRaw.replace(/-/g, '').replace(/\s+/g, '');

      const filtered = ITEMS.filter(item => {
        if (currentFilter === 'winter' && item.season !== 'winter') return false;
        if (currentFilter === 'basic' && item.season !== 'basic') return false;
        if (currentFilter === 'summer' && item.season !== 'summer') return false;
        if (currentFilter === 'female' && item.gender !== 'female') return false;
        if (currentFilter === 'male' && item.gender !== 'male') return false;
        if (currentFilter === 'fast' && !item.isFast) return false;

        if (!query) return true;

        const colorCodes = item.colors.map(c => c.code + " " + c.name).join(' ');
        const fullTarget = (item.code + " " + item.name + " 슬랙스 바지 팬츠 " + item.aliases.join(' ') + " " + colorCodes + " " + item.location + " " + item.warning).toLowerCase().replace(/-/g, '').replace(/\s+/g, '');
        return fullTarget.includes(query);
      });

      itemCount.textContent = `품목 ${filtered.length}개`;

      cardsContainer.innerHTML = filtered.map(item => {
        const genderTag = item.gender === 'female' ? '<span class="tag-gender female">여성</span>' : '<span class="tag-gender male">남성</span>';
        const lengthTag = item.length === 'long' ? '<span class="tag-length long">롱 (10부)</span>' : (item.length === 'short' ? '<span class="tag-length short">숏 (9부)</span>' : '<span class="tag-length long">롱/숏</span>');

        const colorsHtml = item.colors.map(c => `
          <div class="color-chip" onclick="copyText('${c.code}', '${c.name} (${c.code})')">
            <span class="color-dot ${c.dot}"></span>
            <span>${c.name}</span>
            <span style="color:#38bdf8;font-size:0.7rem;font-weight:700;">[${c.code}]</span>
          </div>
        `).join('');

        const sizesHtml = item.sizes.map(s => `<button class="size-btn" onclick="copyText('${item.code.split(' ')[0]}-${s.split('(')[0]}', '${item.code}-${s}')">${s}</button>`).join('');

        return `
          <article class="item-card">
            <div class="card-top">
              <div class="code-badge-group">
                <span class="code-title" onclick="copyText('${item.code}', '품번 ${item.code}')">${item.code}</span>
                ${genderTag}
                ${lengthTag}
              </div>
            </div>
            <div class="item-name-kr">${item.name}</div>
            <div class="alias-text"><strong>주문서 표기명:</strong> ${item.aliases.join(', ')}</div>
            <div class="meta-box">
              <div class="meta-row">
                <span class="meta-label">📍 적재위치:</span>
                <span class="meta-val loc">${item.location}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">📦 권장봉투:</span>
                <span class="meta-val">${item.bag}</span>
              </div>
            </div>
            <div class="colors-grid">${colorsHtml}</div>
            <div class="sizes-wrap">${sizesHtml}</div>
            ${item.warning ? `<div class="card-warning">${item.warning}</div>` : ''}
          </article>
        `;
      }).join('');
    }

              <div class="zone-header-actions">
                <span class="${isMain ? 'zone-badge-main' : 'zone-badge'}">${zone.badge}</span>
                <button type="button" class="zone-btn-sm" onclick="addAisleToZone('${zone.id}')">+ 통행로</button>
                <button type="button" class="zone-btn-sm" onclick="addRowToZone('${zone.id}')">+ 새 행</button>
              </div>
            </div>
            ${elementsHtml}
          </section>
        `;
      }

      // 0: office(스케치2), 1: center(스케치3 메인), 2: south(스케치1)
      const officeZone = currentBoxMap.find(z => z.id === 'zone-office');
      const centerZone = currentBoxMap.find(z => z.id === 'zone-center');
      const southZone = currentBoxMap.find(z => z.id === 'zone-south');

      warehouseContainer.innerHTML = `
        <!-- 🧭 [3] 스케치 3: 북측 벽면 & 중앙 대형 메인 스택존 (상단 단독 전체 폭) -->
        <div class="zone-top-main">
          ${centerZone ? renderZone(centerZone) : ''}
        </div>

        <!-- 하단: 2 (좌측: 휴게실 & 사무실) ── 1 (우측: 남측 코어 & 작업대 신상대) 가로 2열 배치 -->
        <div class="zones-bottom-split">
          ${officeZone ? renderZone(officeZone) : ''}
          ${southZone ? renderZone(southZone) : ''}
        </div>
      `;
    }

        // =============================================================
    // 🚶 세로 통행로 (Vertical Aisle) 제어 함수
    // =============================================================
    function addVAisleToRow(zoneId, rowId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const row = zone.elements.find(el => el.id === rowId);
      if (!row || !row.boxes) return;
      const label = prompt("세로 통행로 이름 (생략 시 '통로'):", "통로");
      if (label === null) return;
      row.boxes.push({
        type: 'v-aisle',
        id: 'va-' + Date.now(),
        label: (label.trim() || '통로')
      });
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("🚶 세로 통행로가 추가되었습니다!");
    }

    function editVAisle(zoneId, rowId, aisleId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const row = zone.elements.find(el => el.id === rowId);
      if (!row || !row.boxes) return;
      const aisle = row.boxes.find(b => b.id === aisleId);
      if (!aisle) return;
      const newLabel = prompt("세로 통행로 이름 수정 (삭제하려면 '삭제' 입력):", aisle.label || '통로');
      if (newLabel === null) return;
      if (newLabel.trim() === '삭제' || newLabel.trim() === '') {
        deleteVAisle(zoneId, rowId, aisleId);
      } else {
        aisle.label = newLabel.trim();
        renderBoxMap();
        saveBoxMapToStorage();
        showToast("✏️ 세로 통행로 이름이 수정되었습니다.");
      }
    }

    function deleteVAisle(zoneId, rowId, aisleId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const row = zone.elements.find(el => el.id === rowId);
      if (!row || !row.boxes) return;
      row.boxes = row.boxes.filter(b => b.id !== aisleId);
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("🗑️ 세로 통행로가 삭제되었습니다.");
    }

    function addAisleToZone(zoneId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const label = prompt("추가할 통행로 이름을 입력하세요:", "🚶 대차 통행로");
      if (!label) return;
      zone.elements.push({
        type: 'aisle',
        id: 'aisle-' + Date.now(),
        label: label.trim()
      });
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("🚶 통행로가 추가되었습니다!");
    }

    function insertAisleAfter(zoneId, elIndex) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const label = prompt("이 행 아래에 삽입할 통행로 이름:", "🚶 피킹 이동 통로");
      if (!label) return;
      zone.elements.splice(elIndex + 1, 0, {
        type: 'aisle',
        id: 'aisle-' + Date.now(),
        label: label.trim()
      });
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("🚶 통행로가 삽입되었습니다!");
    }

    function editAisleName(zoneId, aisleId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const aisle = zone.elements.find(el => el.id === aisleId);
      if (!aisle) return;
      const newLabel = prompt("통행로 이름 수정 (삭제하려면 '삭제' 입력):", aisle.label);
      if (newLabel === null) return;
      if (newLabel.trim() === '삭제' || newLabel.trim() === '') {
        deleteAisle(zoneId, aisleId);
      } else {
        aisle.label = newLabel.trim();
        renderBoxMap();
        saveBoxMapToStorage();
        showToast("✏️ 통행로 이름이 변경되었습니다.");
      }
    }

    function deleteAisle(zoneId, aisleId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      zone.elements = zone.elements.filter(el => el.id !== aisleId);
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("🗑️ 통행로가 삭제되었습니다.");
    }

    function addRowToZone(zoneId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const label = prompt("새 행(라인) 이름을 입력하세요 (예: 4번 더블스택, 외곽 보조라인):", "신규 적재 라인");
      if (!label) return;
      zone.elements.push({
        type: 'row',
        id: 'r-' + Date.now(),
        label: label.trim(),
        boxes: []
      });
      renderBoxMap();
      saveBoxMapToStorage();
      showToast("📦 새 행이 추가되었습니다! '+ 박스'로 상품을 넣어보세요.");
    }

    function addBoxToRow(zoneId, rowId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      const row = zone.elements.find(el => el.id === rowId);
      if (!row || !row.boxes) return;
      const code = prompt("추가할 품번 코드를 입력하세요 (예: 2WC-L, 181, 7712-1):");
      if (!code) return;
      const name = prompt("품목명 또는 설명 (생략 가능):", code);
      row.boxes.push({
        id: 'box-' + Date.now(),
        code: code.trim(),
        name: (name || code).trim(),
        tiers: '9단',
        note: '현장 추가 박스'
      });
      renderBoxMap();
      saveBoxMapToStorage();
      showToast(`📦 [${code}] 박스가 추가되었습니다!`);
    }

    function openEditModal(zoneId, boxId) {
      const zone = currentBoxMap.find(z => z.id === zoneId);
      if (!zone) return;
      for (const el of (zone.elements || [])) {
        if (el.type === 'row' && el.boxes) {
          const box = el.boxes.find(b => b.id === boxId && b.type !== 'v-aisle');
          if (box) {
            editingBox = { zoneId, boxId, box };
            modalCode.value = box.code || '';
            modalName.value = box.name || '';
            modalTiers.value = box.tiers || '9단';
            modalNote.value = box.note || '';
            boxModal.classList.add('open');
            return;
          }
        }
      }
    }

    modalCancelBtn.addEventListener('click', () => boxModal.classList.remove('open'));

    modalSaveBtn.addEventListener('click', () => {
      if (!editingBox) return;
      editingBox.box.code = modalCode.value.trim();
      editingBox.box.name = modalName.value.trim();
      editingBox.box.tiers = modalTiers.value;
      editingBox.box.note = modalNote.value.trim();

      boxModal.classList.remove('open');
      renderBoxMap();
      saveBoxMapToStorage();
    });

    document.getElementById('saveMapBtn').addEventListener('click', saveBoxMapToStorage);
    document.getElementById('resetMapBtn').addEventListener('click', resetBoxMap);

    document.getElementById('addBoxBtn').addEventListener('click', () => {
      const code = prompt("추가할 품번 코드를 입력하세요 (예: 2WC-L, 191, 신상박스):");
      if (!code) return;
      const targetZone = currentBoxMap[0]; // 스케치 3(북측 메인)에 기본 추가
      const firstRow = (targetZone.elements || []).find(el => el.type === 'row');
      if (firstRow) {
        firstRow.boxes.push({
          id: "box-" + Date.now(),
          code: code.trim(),
          name: code.trim() + " 신규 박스",
          tiers: "9단",
          note: "현장 추가 박스"
        });
        renderBoxMap();
        saveBoxMapToStorage();
        showToast(`📦 [${code}] 박스가 추가되었습니다!`);
      }
    });

    // =============================================================
    // 탭 전환 & 검색 연동
    // =============================================================
    tabFinderBtn.addEventListener('click', () => {
      currentTab = 'finder';
      tabFinderBtn.classList.add('active');
      tabMapBtn.classList.remove('active');
      finderWrapper.style.display = 'block';
      mapWrapper.classList.remove('active');
      chipsBar.style.display = 'flex';
      searchInput.placeholder = "품목명, 코드, 옵션 (예: 오비 슬랙스, 세미부츠컷 검정 숏 L, 181)";
    });

    tabMapBtn.addEventListener('click', () => {
      currentTab = 'map';
      tabMapBtn.classList.add('active');
      tabFinderBtn.classList.remove('active');
      finderWrapper.style.display = 'none';
      mapWrapper.classList.add('active');
      chipsBar.style.display = 'none';
      searchInput.placeholder = "지도에서 박스 찾기 (예: 2WC, 181, 6911, 8812 치면 박스가 깜빡임)";
      renderBoxMap();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) clearBtn.classList.add('visible');
      else clearBtn.classList.remove('visible');

      if (currentTab === 'finder') renderFinder();
      else renderBoxMap();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.remove('visible');
      searchInput.focus();
      if (currentTab === 'finder') renderFinder();
      else renderBoxMap();
    });

    chipsBar.addEventListener('click', (e) => {
      const target = e.target.closest('.chip-btn');
      if (!target) return;
      document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('active'));
      target.classList.add('active');
      currentFilter = target.dataset.filter;
      renderFinder();
    });

    // 초기 실행
    renderFinder();
    renderBoxMap();
  </script>
</body>
</html>
