<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아도라블 1초 품번 판독기 (AdoraPick)</title>
  <meta name="description" content="아도라블 슬랙스 주문서 품목명 1초 품번 역매핑 & 창고 피킹 속견표">
  <meta name="theme-color" content="#1e293b">
  <!-- PWA & Mobile WebApp Capable -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-border: #f59e0b;
      --warning-text: #fbbf24;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: #ef4444;
      --tag-long: #10b981;
      --tag-short: #f59e0b;
      --tag-female: #ec4899;
      --tag-male: #3b82f6;
      --tag-winter: #06b6d4;
      --tag-summer: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 80px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* 상단 고정 헤더 & 검색바 */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 0 12px 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
    }

    .stats-count {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* 검색 인풋 영역 */
    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 52px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 14px;
      padding: 0 46px 0 16px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #67e8f9;
      box-shadow: 0 4px 24px rgba(103, 232, 249, 0.35);
    }

    .search-input::placeholder {
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 400;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #475569;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn.visible {
      display: flex;
    }

    /* 퀵 필터 칩 바 */
    .chips-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 2px 0;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #1e293b;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 800;
    }

    /* 카드 리스트 */
    .results-container {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      transition: transform 0.1s, border-color 0.15s;
      position: relative;
    }

    .item-card:active {
      transform: scale(0.99);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .code-badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .code-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 0.5px;
      font-family: "Courier New", Courier, monospace, sans-serif;
    }

    .tag-gender {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tag-gender.female {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
      border: 1px solid #db2777;
    }
    .tag-gender.male {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #2563eb;
    }

    .tag-length {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tag-length.long {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #059669;
    }
    .tag-length.short {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid #d97706;
    }

    .tag-season {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
      border: 1px solid #0891b2;
    }
    .tag-season.summer {
      background: rgba(234, 179, 8, 0.2);
      color: #fde047;
      border: 1px solid #ca8a04;
    }

    .item-name-kr {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .alias-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .alias-text strong {
      color: #cbd5e1;
    }

    /* 위치 및 포장 안내 */
    .meta-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meta-label {
      color: #64748b;
      font-weight: 600;
      min-width: 55px;
    }
    .meta-val {
      color: #e2e8f0;
      font-weight: 600;
    }
    .meta-val.loc {
      color: #38bdf8;
      font-weight: 700;
    }

    /* 컬러 스와치 & 품번 코드 목록 */
    .colors-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .color-chip {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .color-chip:active {
      transform: scale(0.95);
      background: #38bdf8;
      color: #0f172a;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dot-black { background: #000000; }
    .dot-charcoal { background: #3f3f46; }
    .dot-navy { background: #1e3a8a; }
    .dot-ivory { background: #fef08a; }
    .dot-beige { background: #d4d4d8; }
    .dot-brown { background: #78350f; }
    .dot-pink { background: #f472b6; }

    /* 사이즈 터치 환산 칩 */
    .sizes-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 6px;
      border-top: 1px dashed #334155;
    }
    .size-guide-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-right: 4px;
    }
    .size-btn {
      padding: 3px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .size-btn:active {
      background: #10b981;
      color: #fff;
      border-color: #10b981;
    }

    /* 함정/주의사항 배너 */
    .card-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--warning-text);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 토스트 메시지 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 검색 결과 없음 */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }
    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
    }
  </style>
</head>

      {

        colors: [

        bag: "3호",
        warning: "여름용 와이드 실루엣 (11블랙, 33네이비, 44아이, 99연베)",
        colors: [

          { code: "5999", name: "연베이지 (5999)", dot: "dot-beige" }
        ],
        sizes: ["28(S)", "30(M)", "32(L)", "34(XL)", "36(2XL)"]
      }
    ];

    // -------------------------------------------------------------
    // 한글 초성 분리 검색 유틸
    // -------------------------------------------------------------
    const CHOSUNG = [
      'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
    ];

    function getChosung(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code >= 0 && code <= 11171) {
          result += CHOSUNG[Math.floor(code / 588)];
        } else {
          result += str.charAt(i);
        }
      }
      return result;
    }

    // -------------------------------------------------------------
    // 상태 및 엘리먼트 바인딩
    // -------------------------------------------------------------
    let currentFilter = 'all';
    let searchQuery = '';

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const cardsContainer = document.getElementById('cardsContainer');
    const itemCount = document.getElementById('itemCount');
    const chipsBar = document.getElementById('chipsBar');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1400);
    }

    // 클립보드 복사
    function copyText(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`📋 ${label || text} 복사됨`);
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`📋 ${label || text} 복사됨`);
    }

    // -------------------------------------------------------------
    // 필터링 & 검색 엔진
    // -------------------------------------------------------------
    function filterItems() {
      const query = searchQuery.trim().toLowerCase().replace(/-/g, '').replace(/\s+/g, '');
      const queryChosung = getChosung(searchQuery.trim().toLowerCase().replace(/\s+/g, ''));

      return ITEMS.filter(item => {
        // 1. 칩 필터
        if (currentFilter === 'winter' && item.season !== 'winter') return false;
        if (currentFilter === 'basic' && item.season !== 'basic') return false;
        if (currentFilter === 'summer' && item.season !== 'summer') return false;
        if (currentFilter === 'female' && item.gender !== 'female') return false;
        if (currentFilter === 'male' && item.gender !== 'male') return false;
        if (currentFilter === 'fast' && !item.isFast) return false;

        // 2. 검색어 필터 (비어있으면 통과)
        if (!query) return true;

        // 전체 검색 대상 텍스트 합성
        const colorCodes = item.colors.map(c => c.code + " " + c.name).join(' ');
        const fullTarget = (
          item.code + " " +
          item.name + " " +
          item.aliases.join(' ') + " " +
          colorCodes + " " +
          item.location + " " +
          item.warning
        ).toLowerCase();

        const cleanTarget = fullTarget.replace(/-/g, '').replace(/\s+/g, '');
        const targetChosung = getChosung(cleanTarget);

        // 검색어 일반 매칭 or 초성 매칭
        if (cleanTarget.includes(query)) return true;
        if (targetChosung.includes(queryChosung)) return true;

        // 개별 키워드 공백 분리 다중 매칭 지원 (예: '기모 먹' -> 기모와 먹이 둘 다 있어야 함)
        const words = searchQuery.trim().toLowerCase().split(/\s+/);
        const allWordsMatch = words.every(w => {
          const wClean = w.replace(/-/g, '');
          const wCho = getChosung(wClean);
          return cleanTarget.includes(wClean) || targetChosung.includes(wCho);
        });

        return allWordsMatch;
      });
    }

    // -------------------------------------------------------------
    // 카드 렌더링
    // -------------------------------------------------------------
    function renderCards() {
      const filtered = filterItems();
      itemCount.textContent = `결과 ${filtered.length}개`;

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">검색된 품목이 없습니다</div>
            <p style="font-size: 0.85rem;">품목명, 코드(181, 7712, SAS), 색상(차콜, 먹색) 등을 확인해보세요.</p>
          </div>
        `;
        return;
      }

      cardsContainer.innerHTML = filtered.map(item => {
        const genderTag = item.gender === 'female' 
          ? '<span class="tag-gender female">여성</span>' 
          : '<span class="tag-gender male">남성</span>';

        let lengthTag = '';
        if (item.length === 'long') lengthTag = '<span class="tag-length long">롱 (10부)</span>';
        else if (item.length === 'short') lengthTag = '<span class="tag-length short">숏 (9부)</span>';
        else if (item.length === 'both') lengthTag = '<span class="tag-length long">롱/숏 혼합</span>';

        const seasonTag = item.season === 'winter'
          ? '<span class="tag-season">❄️ 기모/본딩</span>'
          : (item.season === 'summer' ? '<span class="tag-season summer">☀️ 쿨/라이크라</span>' : '<span class="tag-season" style="background:rgba(100,116,139,0.2);color:#94a3b8;border-color:#475569;">사계절</span>');

        // 컬러 칩 생성
        const colorsHtml = item.colors.map(c => `
          <div class="color-chip" onclick="copyText('${c.code}', '${c.name} (${c.code})')">
            <span class="color-dot ${c.dot}"></span>
            <span>${c.name}</span>
            <span style="color:#38bdf8;font-size:0.7rem;font-weight:700;">[${c.code}]</span>
          </div>
        `).join('');

        // 사이즈 버튼 생성
        const sizesHtml = item.sizes.map(s => {
          const pureSize = s.split('(')[0];
          return `<button class="size-btn" onclick="copySizeWithCode('${item.code}', '${pureSize}')">${s}</button>`;
        }).join('');

        return `
          <article class="item-card">
            <div class="card-top">
              <div class="code-badge-group">
                <span class="code-title" onclick="copyText('${item.code}', '품번 ${item.code}')">${item.code}</span>
                ${genderTag}
                ${lengthTag}
                ${seasonTag}
              </div>
            </div>

            <div class="item-name-kr">${item.name}</div>
            
            <div class="alias-text">
              <strong>주문서 표기명:</strong> ${item.aliases.join(', ')}
            </div>

            <div class="meta-box">
              <div class="meta-row">
                <span class="meta-label">📍 창고위치:</span>
                <span class="meta-val loc">${item.location}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">📦 권장봉투:</span>
                <span class="meta-val">${item.bag}</span>
              </div>
            </div>

            <!-- 색상별 코드 -->
            <div style="font-size:0.75rem;color:#94a3b8;margin-bottom:4px;font-weight:600;">🎨 색상별 품번 (터치 시 복사):</div>
            <div class="colors-grid">
              ${colorsHtml}
            </div>

            <!-- 사이즈 환산 -->
            <div class="sizes-wrap">
              <span class="size-guide-label">📏 사이즈:</span>
              ${sizesHtml}
            </div>

            <!-- 경고 배너 -->
            ${item.warning ? `<div class="card-warning">${item.warning}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    // 품번 + 사이즈 조합 복사
    function copySizeWithCode(itemCode, size) {
      const fullCode = `${itemCode}-${size}`;
      copyText(fullCode, `${fullCode}`);
    }

    // -------------------------------------------------------------
    // 이벤트 리스너 등록
    // -------------------------------------------------------------
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearBtn.classList.add('visible');
      } else {
        clearBtn.classList.remove('visible');
      }
      renderCards();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.remove('visible');
      searchInput.focus();
      renderCards();
    });

    chipsBar.addEventListener('click', (e) => {
      const target = e.target.closest('.chip-btn');
      if (!target) return;

      document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('active'));
      target.classList.add('active');

      currentFilter = target.dataset.filter;
      renderCards();
    });

    // 초기 렌더링
    renderCards();
  </script>
